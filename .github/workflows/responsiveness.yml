name: 6529bot Responsiveness

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: Target repository in owner/name form.
        required: true
        default: 6529-Collections/6529seize-frontend
        type: string
      pr_number:
        description: Existing target repository PR number to benchmark.
        required: true
        type: string
      installation_id:
        description: GitHub App installation id for the target repo (required for private targets).
        required: false
        default: ""
        type: string
      runner_label:
        description: GitHub runner label.
        required: true
        default: ubuntu-latest
        type: string
      contexts:
        description: Comma-separated responsiveness contexts.
        required: true
        default: web-desktop,web-mobile,native-mobile,electron-desktop
        type: string
      max_pages:
        description: Maximum inferred routes to check.
        required: true
        default: "12"
        type: string
      workers:
        description: Playwright worker count.
        required: true
        default: "4"
        type: string
      plan_only:
        description: Only infer routes and write the plan; skip Playwright.
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: read

jobs:
  responsiveness:
    name: Responsiveness benchmark
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 20
    env:
      TARGET_REPO: ${{ inputs.target_repo }}
      PR_NUMBER: ${{ inputs.pr_number }}
      API_ENDPOINT: https://api.6529.io
      WS_ENDPOINT: wss://ws.6529.io
      ALLOWLIST_API_ENDPOINT: https://allowlist-api.6529.io
      MOBILE_APP_SCHEME: mobile6529
      CORE_SCHEME: core6529
      NEXTGEN_CHAIN_ID: "1"
      IPFS_API_ENDPOINT: https://api-ipfs.6529.io
      IPFS_GATEWAY_ENDPOINT: https://ipfs.6529.io
      ASSETS_FROM_S3: "false"
      REVIEWBOT_RESPONSIVENESS_API_ENDPOINT: https://api.6529.io
      REVIEWBOT_RESPONSIVENESS_WS_ENDPOINT: wss://ws.6529.io
      REVIEWBOT_RESPONSIVENESS_ALLOWLIST_API_ENDPOINT: https://allowlist-api.6529.io
      REVIEWBOT_RESPONSIVENESS_MOBILE_APP_SCHEME: mobile6529
      REVIEWBOT_RESPONSIVENESS_CORE_SCHEME: core6529
      REVIEWBOT_RESPONSIVENESS_NEXTGEN_CHAIN_ID: "1"
      REVIEWBOT_RESPONSIVENESS_IPFS_API_ENDPOINT: https://api-ipfs.6529.io
      REVIEWBOT_RESPONSIVENESS_IPFS_GATEWAY_ENDPOINT: https://ipfs.6529.io
      REVIEWBOT_RESPONSIVENESS_ASSETS_FROM_S3: "false"
    steps:
      - name: Checkout bot
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: bot
          persist-credentials: false

      - name: Set up bot Node
        if: ${{ inputs.installation_id != '' }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bot/package-lock.json

      - name: Install bot dependencies
        if: ${{ inputs.installation_id != '' }}
        working-directory: bot
        run: npm ci

      - name: Mint target installation token
        if: ${{ inputs.installation_id != '' }}
        id: installation-token
        env:
          REVIEWBOT_GITHUB_APP_ID: ${{ secrets.REVIEWBOT_GITHUB_APP_ID }}
          REVIEWBOT_GITHUB_APP_PRIVATE_KEY_BASE64: ${{ secrets.REVIEWBOT_GITHUB_APP_PRIVATE_KEY_BASE64 }}
        run: |
          node bot/bin/github-app-installation-token.cjs \
            --installation-id "${{ inputs.installation_id }}" \
            --github-actions-output

      - name: Resolve target PR
        id: pr
        env:
          GH_TOKEN: ${{ steps.installation-token.outputs.token || github.token }}
        run: |
          set -euo pipefail
          mkdir -p .reviewbot
          gh api "repos/${TARGET_REPO}/pulls/${PR_NUMBER}" > .reviewbot/pr.json
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require("fs");
          const pr = JSON.parse(fs.readFileSync(".reviewbot/pr.json", "utf8"));
          const fields = {
            base_sha: pr.base.sha,
            head_sha: pr.head.sha,
            base_repo: pr.base.repo.full_name,
            head_repo: pr.head.repo.full_name,
            base_ref: pr.base.ref,
            head_ref: pr.head.ref,
          };
          for (const [key, value] of Object.entries(fields)) {
            if (!value || String(value).includes("\n")) {
              throw new Error(`invalid ${key}`);
            }
            console.log(`${key}=${value}`);
          }
          NODE

      - name: Checkout target PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ steps.pr.outputs.head_repo }}
          ref: ${{ steps.pr.outputs.head_sha }}
          path: target
          token: ${{ steps.installation-token.outputs.token || github.token }}
          fetch-depth: 1
          persist-credentials: false

      - name: Fetch target PR base commit
        env:
          GH_TOKEN: ${{ steps.installation-token.outputs.token || github.token }}
          BASE_REPO: ${{ steps.pr.outputs.base_repo }}
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
        run: |
          set -euo pipefail
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -C target remote add base "https://github.com/${BASE_REPO}.git" || \
            git -C target remote set-url base "https://github.com/${BASE_REPO}.git"
          git -C target -c "http.https://github.com/.extraheader=${auth_header}" \
            fetch --no-tags --depth=1 base "${BASE_SHA}"
          git -C target cat-file -e "${BASE_SHA}^{commit}"

      - name: Enable pnpm for cache
        working-directory: target
        run: |
          corepack enable pnpm
          corepack prepare "$(node -p 'require("./package.json").packageManager')" --activate
          pnpm --version
          mkdir -p "$(pnpm store path --silent)"

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: target/pnpm-lock.yaml

      - name: Activate pinned pnpm
        working-directory: target
        run: |
          corepack enable pnpm
          corepack prepare "$(node -p 'require("./package.json").packageManager')" --activate
          pnpm --version

      - name: Install Socket Firewall
        if: ${{ !inputs.plan_only }}
        id: socket_firewall
        uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall

      - name: Install target dependencies
        if: ${{ !inputs.plan_only }}
        working-directory: target
        env:
          SFW_BIN: ${{ steps.socket_firewall.outputs.firewall-path-binary }}
        run: ./bin/6529 install:frozen

      - name: Install Chromium for Playwright
        if: ${{ !inputs.plan_only }}
        working-directory: target
        run: ./bin/6529 exec playwright install chromium

      - name: Run responsiveness benchmark
        id: responsiveness
        env:
          PLAN_ONLY: ${{ inputs.plan_only && '--plan-only' || '' }}
        run: |
          set -euo pipefail
          node bot/bin/responsiveness-runner.cjs \
            --target target \
            --base-ref "${{ steps.pr.outputs.base_sha }}" \
            --head-ref HEAD \
            --output-dir target/.reviewbot-responsiveness \
            --contexts "${{ inputs.contexts }}" \
            --max-pages "${{ inputs.max_pages }}" \
            --workers "${{ inputs.workers }}" \
            $PLAN_ONLY

      - name: Write job summary
        if: always()
        run: |
          if [ -f target/.reviewbot-responsiveness/summary.md ]; then
            cat target/.reviewbot-responsiveness/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload responsiveness artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: responsiveness-pr-${{ inputs.pr_number }}
          path: target/.reviewbot-responsiveness
          if-no-files-found: warn
          include-hidden-files: true
