name: 6529bot Responsiveness Review
run-name: "${{ inputs.target_repo }}#${{ inputs.pr_number }} responsiveness @ ${{ inputs.head_ref || inputs.head_sha }}"

on:
  workflow_dispatch:
    inputs:
      job_id:
        required: true
        type: string
      run_key:
        required: true
        type: string
      installation_id:
        required: true
        type: string
      target_repo:
        required: true
        type: string
      head_repo:
        required: true
        type: string
      pr_number:
        required: true
        type: string
      head_sha:
        required: true
        type: string
      base_sha:
        required: false
        type: string
      head_ref:
        required: false
        type: string
      review_kind:
        required: true
        type: choice
        options:
          - responsiveness
      provider:
        required: true
        type: string
      model:
        required: true
        type: string
      lane:
        required: true
        type: string
      requestor:
        required: false
        type: string

permissions:
  contents: read
  id-token: write
  issues: write
  pull-requests: read

jobs:
  benchmark:
    name: Responsiveness benchmark
    runs-on: ubuntu-latest
    outputs:
      artifact_url: ${{ steps.upload-responsiveness-artifacts.outputs.artifact-url }}
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: ${{ fromJSON(vars.REVIEWBOT_RESPONSIVENESS_TIMEOUT_MINUTES || '20') }}
    concurrency:
      group: reviewbot-worker-${{ inputs.run_key }}
      cancel-in-progress: false
    env:
      TARGET_REPO: ${{ inputs.target_repo }}
      PR_NUMBER: ${{ inputs.pr_number }}
      API_ENDPOINT: https://api.6529.io
      WS_ENDPOINT: wss://ws.6529.io
      ALLOWLIST_API_ENDPOINT: https://allowlist-api.6529.io
      MOBILE_APP_SCHEME: mobile6529
      CORE_SCHEME: core6529
      NEXTGEN_CHAIN_ID: "1"
      IPFS_API_ENDPOINT: https://api-ipfs.6529.io
      IPFS_GATEWAY_ENDPOINT: https://ipfs.6529.io
      ASSETS_FROM_S3: "false"
      REVIEWBOT_RESPONSIVENESS_API_ENDPOINT: https://api.6529.io
      REVIEWBOT_RESPONSIVENESS_WS_ENDPOINT: wss://ws.6529.io
      REVIEWBOT_RESPONSIVENESS_ALLOWLIST_API_ENDPOINT: https://allowlist-api.6529.io
      REVIEWBOT_RESPONSIVENESS_MOBILE_APP_SCHEME: mobile6529
      REVIEWBOT_RESPONSIVENESS_CORE_SCHEME: core6529
      REVIEWBOT_RESPONSIVENESS_NEXTGEN_CHAIN_ID: "1"
      REVIEWBOT_RESPONSIVENESS_IPFS_API_ENDPOINT: https://api-ipfs.6529.io
      REVIEWBOT_RESPONSIVENESS_IPFS_GATEWAY_ENDPOINT: https://ipfs.6529.io
      REVIEWBOT_RESPONSIVENESS_ASSETS_FROM_S3: "false"
    steps:
      - name: Checkout bot
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          path: bot
          persist-credentials: false

      - name: Set up bot Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bot/package-lock.json

      - name: Install bot dependencies
        working-directory: bot
        run: npm ci

      - name: Mint target installation token
        id: installation-token
        env:
          REVIEWBOT_GITHUB_APP_ID: ${{ secrets.REVIEWBOT_GITHUB_APP_ID }}
          REVIEWBOT_GITHUB_APP_PRIVATE_KEY_BASE64: ${{ secrets.REVIEWBOT_GITHUB_APP_PRIVATE_KEY_BASE64 }}
        run: |
          node bot/bin/github-app-installation-token.cjs \
            --installation-id "${{ inputs.installation_id }}" \
            --github-actions-output

      - name: Resolve target PR
        id: pr
        env:
          GH_TOKEN: ${{ steps.installation-token.outputs.token }}
        run: |
          set -euo pipefail
          mkdir -p .reviewbot
          gh api "repos/${TARGET_REPO}/pulls/${PR_NUMBER}" > .reviewbot/pr.json
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require("fs");
          const pr = JSON.parse(fs.readFileSync(".reviewbot/pr.json", "utf8"));
          const fields = {
            base_sha: pr.base.sha,
            head_sha: pr.head.sha,
            base_repo: pr.base.repo.full_name,
            head_repo: pr.head.repo.full_name,
            base_ref: pr.base.ref,
            head_ref: pr.head.ref,
          };
          for (const [key, value] of Object.entries(fields)) {
            if (!value || String(value).includes("\n")) {
              throw new Error(`invalid ${key}`);
            }
            console.log(`${key}=${value}`);
          }
          NODE

      - name: Checkout target PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ steps.pr.outputs.head_repo }}
          ref: ${{ inputs.head_sha }}
          path: target
          token: ${{ steps.pr.outputs.head_repo == inputs.target_repo && steps.installation-token.outputs.token || '' }}
          fetch-depth: 1
          persist-credentials: false

      - name: Initialize responsiveness artifact directory
        if: always()
        run: |
          mkdir -p target/.reviewbot-responsiveness
          cp .reviewbot/pr.json target/.reviewbot-responsiveness/pr.json 2>/dev/null || true

      - name: Fetch target PR base commit
        run: |
          set -euo pipefail
          git -C target remote add base "https://github.com/${{ steps.pr.outputs.base_repo }}.git" || \
            git -C target remote set-url base "https://github.com/${{ steps.pr.outputs.base_repo }}.git"
          git -C target fetch --no-tags --depth=1 base "${{ inputs.base_sha || steps.pr.outputs.base_sha }}"
          git -C target cat-file -e "${{ inputs.base_sha || steps.pr.outputs.base_sha }}^{commit}"

      - name: Enable pnpm for cache
        working-directory: target
        run: |
          corepack enable pnpm
          corepack prepare "$(node -p 'require("./package.json").packageManager')" --activate
          pnpm --version
          mkdir -p "$(pnpm store path --silent)"

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: target/pnpm-lock.yaml

      - name: Activate pinned pnpm
        working-directory: target
        run: |
          corepack enable pnpm
          corepack prepare "$(node -p 'require("./package.json").packageManager')" --activate
          pnpm --version

      - name: Install Socket Firewall
        id: socket_firewall
        uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall

      - name: Install target dependencies
        working-directory: target
        env:
          SFW_BIN: ${{ steps.socket_firewall.outputs.firewall-path-binary }}
        run: ./bin/6529 install:frozen

      - name: Install Chromium for Playwright
        working-directory: target
        run: ./bin/6529 exec playwright install chromium

      - name: Run responsiveness benchmark
        run: |
          set +e
          mkdir -p target/.reviewbot-responsiveness
          cp .reviewbot/pr.json target/.reviewbot-responsiveness/pr.json 2>/dev/null || true
          node bot/bin/responsiveness-runner.cjs \
            --target target \
            --base-ref "${{ inputs.base_sha || steps.pr.outputs.base_sha }}" \
            --head-ref HEAD \
            --output-dir target/.reviewbot-responsiveness \
            --contexts "${{ vars.REVIEWBOT_RESPONSIVENESS_CONTEXTS || 'web-desktop,web-mobile,native-mobile,electron-desktop' }}" \
            --max-pages "${{ vars.REVIEWBOT_RESPONSIVENESS_MAX_PAGES || '12' }}" \
            --workers "${{ vars.REVIEWBOT_RESPONSIVENESS_WORKERS || '4' }}"
          code=$?
          echo "$code" > target/.reviewbot-responsiveness/exit-code.txt
          exit 0

      - name: Write job summary
        if: always()
        run: |
          if [ -f target/.reviewbot-responsiveness/summary.md ]; then
            cat target/.reviewbot-responsiveness/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload responsiveness artifacts
        id: upload-responsiveness-artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: responsiveness-${{ inputs.job_id }}
          path: target/.reviewbot-responsiveness
          if-no-files-found: warn
          include-hidden-files: true

      - name: Enforce responsiveness result
        if: always()
        run: |
          code=1
          if [ -f target/.reviewbot-responsiveness/exit-code.txt ]; then
            code="$(cat target/.reviewbot-responsiveness/exit-code.txt)"
          fi
          if [ "$code" != "0" ]; then
            echo "Responsiveness benchmark failed with exit code $code after artifacts were uploaded."
            exit "$code"
          fi

  comment:
    name: Post responsiveness review
    if: always()
    needs: benchmark
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: read
    timeout-minutes: 10
    steps:
      - name: Checkout bot
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          path: bot
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bot/package-lock.json

      - name: Install bot dependencies
        working-directory: bot
        run: npm ci

      - name: Download responsiveness artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        continue-on-error: true
        with:
          name: responsiveness-${{ inputs.job_id }}
          path: .reviewbot-responsiveness

      - name: Configure AWS credentials for reviewbot ledgers and artifacts
        if: ${{ (vars.REVIEWBOT_RESPONSIVENESS_ARTIFACTS_AWS_ROLE_ARN || vars.REVIEW_USAGE_AWS_ROLE_ARN) != '' }}
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          aws-region: ${{ vars.REVIEWBOT_RESPONSIVENESS_ARTIFACTS_AWS_REGION || vars.REVIEW_USAGE_AWS_REGION || 'us-east-1' }}
          role-to-assume: ${{ vars.REVIEWBOT_RESPONSIVENESS_ARTIFACTS_AWS_ROLE_ARN || vars.REVIEW_USAGE_AWS_ROLE_ARN }}

      - name: Upload visible responsiveness artifacts
        id: visible-artifacts
        if: always()
        env:
          REVIEWBOT_RESPONSIVENESS_WORKSPACE: ${{ github.workspace }}/.reviewbot-responsiveness
          REVIEWBOT_JOB_ID: ${{ inputs.job_id }}
          GH_REPO: ${{ inputs.target_repo }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_HEAD_SHA: ${{ inputs.head_sha }}
          REVIEWBOT_RESPONSIVENESS_ARTIFACTS_ENABLED: ${{ vars.REVIEWBOT_RESPONSIVENESS_ARTIFACTS_ENABLED || 'false' }}
          REVIEWBOT_RESPONSIVENESS_ARTIFACTS_AWS_REGION: ${{ vars.REVIEWBOT_RESPONSIVENESS_ARTIFACTS_AWS_REGION || vars.REVIEW_USAGE_AWS_REGION || 'us-east-1' }}
          REVIEWBOT_RESPONSIVENESS_ARTIFACTS_S3_BUCKET: ${{ vars.REVIEWBOT_RESPONSIVENESS_ARTIFACTS_S3_BUCKET }}
          REVIEWBOT_RESPONSIVENESS_ARTIFACTS_S3_PREFIX: ${{ vars.REVIEWBOT_RESPONSIVENESS_ARTIFACTS_S3_PREFIX || 'responsiveness' }}
          REVIEWBOT_RESPONSIVENESS_ARTIFACTS_VIEWER_BASE_URL: ${{ vars.REVIEWBOT_RESPONSIVENESS_ARTIFACTS_VIEWER_BASE_URL || vars.REVIEWBOT_PUBLIC_BASE_URL || '' }}
          REVIEWBOT_RESPONSIVENESS_ARTIFACTS_VIEWER_PATH_PREFIX: ${{ vars.REVIEWBOT_RESPONSIVENESS_ARTIFACTS_VIEWER_PATH_PREFIX || '/artifacts/responsiveness' }}
        run: |
          node bot/bin/responsiveness-artifacts-upload.cjs \
            --workspace "$REVIEWBOT_RESPONSIVENESS_WORKSPACE" \
            --github-actions-output

      - name: Mint target installation token
        id: installation-token
        env:
          REVIEWBOT_GITHUB_APP_ID: ${{ secrets.REVIEWBOT_GITHUB_APP_ID }}
          REVIEWBOT_GITHUB_APP_PRIVATE_KEY_BASE64: ${{ secrets.REVIEWBOT_GITHUB_APP_PRIVATE_KEY_BASE64 }}
        run: |
          node bot/bin/github-app-installation-token.cjs \
            --installation-id "${{ inputs.installation_id }}" \
            --github-actions-output

      - name: Post 6529bot responsiveness review
        env:
          GH_TOKEN: ${{ steps.installation-token.outputs.token }}
          GH_REPO: ${{ inputs.target_repo }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_HEAD_SHA: ${{ inputs.head_sha }}
          PR_BASE_SHA: ${{ inputs.base_sha }}
          PR_HEAD_REF: ${{ inputs.head_ref }}
          PR_HEAD_REPO: ${{ inputs.head_repo }}
          REVIEWBOT_JOB_ID: ${{ inputs.job_id }}
          REVIEWBOT_RUN_KEY: ${{ inputs.run_key }}
          REVIEWBOT_REQUESTOR: ${{ inputs.requestor }}
          REVIEWBOT_WORKFLOW_JOB: responsiveness-review
          REVIEWBOT_RESPONSIVENESS_WORKSPACE: ${{ github.workspace }}/.reviewbot-responsiveness
          REVIEWBOT_RESPONSIVENESS_ARTIFACT_URL: ${{ needs.benchmark.outputs.artifact_url }}
          REVIEWBOT_RESPONSIVENESS_ESTIMATED_COST_USD: ${{ vars.REVIEWBOT_RESPONSIVENESS_ESTIMATED_COST_USD || vars.REVIEWBOT_BUDGET_DEFAULT_ESTIMATED_COST_USD || '1' }}
          REVIEWBOT_RESPONSIVENESS_AI_ENABLED: ${{ vars.REVIEWBOT_RESPONSIVENESS_AI_ENABLED || 'true' }}
          REVIEWBOT_RESPONSIVENESS_AI_MODEL: ${{ vars.REVIEWBOT_RESPONSIVENESS_AI_MODEL || vars.REVIEW_DEFAULT_ANTHROPIC_MODEL || 'claude-opus-4-8' }}
          REVIEWBOT_RESPONSIVENESS_AI_MAX_IMAGES: ${{ vars.REVIEWBOT_RESPONSIVENESS_AI_MAX_IMAGES || '48' }}
          REVIEWBOT_RESPONSIVENESS_AI_MAX_SOURCE_IMAGE_BYTES: ${{ vars.REVIEWBOT_RESPONSIVENESS_AI_MAX_SOURCE_IMAGE_BYTES || '40000000' }}
          REVIEWBOT_RESPONSIVENESS_AI_MAX_IMAGE_BYTES: ${{ vars.REVIEWBOT_RESPONSIVENESS_AI_MAX_IMAGE_BYTES || '8000000' }}
          REVIEWBOT_RESPONSIVENESS_AI_MAX_IMAGE_DIMENSION: ${{ vars.REVIEWBOT_RESPONSIVENESS_AI_MAX_IMAGE_DIMENSION || '1600' }}
          REVIEWBOT_RESPONSIVENESS_AI_IMAGE_QUALITY: ${{ vars.REVIEWBOT_RESPONSIVENESS_AI_IMAGE_QUALITY || '82' }}
          REVIEWBOT_RESPONSIVENESS_AI_MAX_OUTPUT_TOKENS: ${{ vars.REVIEWBOT_RESPONSIVENESS_AI_MAX_OUTPUT_TOKENS || '1800' }}
          REVIEWBOT_RESPONSIVENESS_VISUAL_ESTIMATED_COST_USD: ${{ vars.REVIEWBOT_RESPONSIVENESS_VISUAL_ESTIMATED_COST_USD || '5' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REVIEW_USAGE_ENABLED: true
          REVIEW_USAGE_AWS_REGION: ${{ vars.REVIEW_USAGE_AWS_REGION }}
          REVIEW_USAGE_DB_RESOURCE_ARN: ${{ vars.REVIEW_USAGE_DB_RESOURCE_ARN }}
          REVIEW_USAGE_DB_SECRET_ARN: ${{ vars.REVIEW_USAGE_DB_SECRET_ARN }}
          REVIEW_USAGE_DB_NAME: ${{ vars.REVIEW_USAGE_DB_NAME }}
          REVIEW_USAGE_DB_SCHEMA: ${{ vars.REVIEW_USAGE_DB_SCHEMA }}
          REVIEWBOT_RUN_CONTROL_LEDGER_ENABLED: ${{ vars.REVIEWBOT_RUN_CONTROL_LEDGER_ENABLED || 'false' }}
          REVIEWBOT_RUN_CONTROL_LEDGER_AWS_REGION: ${{ vars.REVIEWBOT_RUN_CONTROL_LEDGER_AWS_REGION || vars.REVIEW_USAGE_AWS_REGION }}
          REVIEWBOT_RUN_CONTROL_LEDGER_DB_RESOURCE_ARN: ${{ vars.REVIEWBOT_RUN_CONTROL_LEDGER_DB_RESOURCE_ARN || vars.REVIEW_USAGE_DB_RESOURCE_ARN }}
          REVIEWBOT_RUN_CONTROL_LEDGER_DB_SECRET_ARN: ${{ vars.REVIEWBOT_RUN_CONTROL_LEDGER_DB_SECRET_ARN || vars.REVIEW_USAGE_DB_SECRET_ARN }}
          REVIEWBOT_RUN_CONTROL_LEDGER_DB_NAME: ${{ vars.REVIEWBOT_RUN_CONTROL_LEDGER_DB_NAME || vars.REVIEW_USAGE_DB_NAME }}
          REVIEWBOT_RUN_CONTROL_LEDGER_DB_SCHEMA: ${{ vars.REVIEWBOT_RUN_CONTROL_LEDGER_DB_SCHEMA || vars.REVIEW_USAGE_DB_SCHEMA }}
        run: node bot/bin/responsiveness-review.cjs
